[package]
name = "localproxy"
version = "0.1.8"
edition = "2024"
description = "Local proxy daemon that forwards HTTP and HTTPS traffic through a configurable upstream chain"
license = "MIT"
repository = "https://github.com/jgermade/localproxy"
homepage = "https://github.com/jgermade/localproxy"
readme = "README.md"
keywords = ["proxy", "http", "socks5", "daemon", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.12"
dirs = "6.0"
fs2 = "0.4"
http = "1.3"
libc = "0.2"
notify-rust = "4"
pin-project-lite = "0.2"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47", features = ["full"] }
tokio-socks = "0.5"
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
